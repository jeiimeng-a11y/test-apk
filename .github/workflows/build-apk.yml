name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Android Project
        run: |
          mkdir -p app/src/main/java/com/engineering/biomasscalc app/src/main/assets
          printf 'rootProject.name = "BiomassSteamCalc"\ninclude(":app")\n' > settings.gradle
          printf 'buildscript {\n  repositories { google(); mavenCentral() }\n  dependencies { classpath "com.android.tools.build:gradle:8.2.2" }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle
          printf 'plugins { id "com.android.application" }\nandroid {\n  namespace "com.engineering.biomasscalc"\n  compileSdk 34\n  defaultConfig {\n    applicationId "com.engineering.biomasscalc"\n    minSdk 24\n    targetSdk 34\n    versionCode 1\n    versionName "1.0"\n  }\n  buildTypes { release { minifyEnabled false } }\n}\n' > app/build.gradle
          printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n  <application android:allowBackup="true" android:label="Biomass Steam Calc" android:theme="@android:style/Theme.NoTitleBar">\n    <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">\n      <intent-filter>\n        <action android:name="android.intent.action.MAIN" />\n        <category android:name="android.intent.category.LAUNCHER" />\n      </intent-filter>\n    </activity>\n  </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml
          printf 'package com.engineering.biomasscalc;\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.webkit.WebSettings;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\npublic class MainActivity extends Activity {\n  @Override protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    WebView w = new WebView(this);\n    WebSettings s = w.getSettings();\n    s.setJavaScriptEnabled(true);\n    s.setDomStorageEnabled(true);\n    s.setAllowFileAccess(true);\n    w.setWebViewClient(new WebViewClient());\n    w.loadUrl("file:///android_asset/index.html");\n    setContentView(w);\n  }\n}\n' > app/src/main/java/com/engineering/biomasscalc/MainActivity.java
          if [ -f "Biomass_Boiler_Mobile_App.html" ]; then
            cp Biomass_Boiler_Mobile_App.html app/src/main/assets/index.html
          elif [ -f "index.html" ]; then
            cp index.html app/src/main/assets/index.html
          else
            echo "HTML file not found!" && ls -la && exit 1
          fi
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiomassSteamCalc-APK
          path: app/build/outputs/apk/debug/app-debug.apk
